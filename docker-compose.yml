services:
  backvault:
    # Published image from GitHub Container Registry (linux/amd64)
    image: ghcr.io/tgrecojr/backvault:latest

    # OR: Build locally (uncomment the line below and comment out 'image' above)
    # On macOS the image is amd64; see BUILD.md.
    # build:
    #   context: .
    #   platforms:
    #     - linux/amd64

    container_name: backvault
    restart: unless-stopped

    # Run as current user to avoid permission issues with mounted volumes
    user: "${UID:-1000}:${GID:-1000}"

    # No security_opt needed: the container runs under Docker's default seccomp profile.

    environment:
      # Required credentials
      BW_CLIENT_ID: "${BW_CLIENT_ID}"
      BW_CLIENT_SECRET: "${BW_CLIENT_SECRET}"
      BW_PASSWORD: "${BW_PASSWORD}"
      BW_SERVER: "${BW_SERVER}"
      BW_FILE_PASSWORD: "${BW_FILE_PASSWORD}"

      # Optional configuration
      BACKUP_INTERVAL_HOURS: "${BACKUP_INTERVAL_HOURS:-12}"
      RETAIN_DAYS: "${RETAIN_DAYS:-7}"

      # Self-signed server: mount your CA bundle (see volumes) and point at it.
      # BW_CA_CERT: /app/ca.pem

    volumes:
      - ./backups:/app/backups
      # - ./ca.pem:/app/ca.pem:ro

    # Optional: Limit resource usage. Accounts using Argon2id with a large
    # memory setting need at least that much headroom (default is 64 MiB).
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 512M
    #     reservations:
    #       cpus: '0.5'
    #       memory: 256M
