name: Test

on:
  pull_request:

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests (format fixtures and restore-tool subprocess tests included)
        run: cargo test --workspace --locked

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: backvault:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # The runtime is distroless static: no shell, one executable. `--version` is the
        # only path that exits on its own, and it can only succeed if the binary is truly
        # static and runs under Docker's default seccomp profile.
        run: |
          out="$(docker run --rm backvault:test --version)"
          echo "$out"
          case "$out" in backvault\ *) ;; *) echo "unexpected output"; exit 1;; esac
