name: Supply chain scan

on:
  workflow_call:
    secrets:
      SOCKET_SECURITY_API_KEY:
        # Not marked required: bot-authored PRs (Renovate) run in an isolated context
        # without access to repo secrets. With required: true the reusable-workflow call
        # fails before any job runs; required: false lets the rest of the scan run, and
        # the Socket step below self-skips when the secret is absent.
        required: false

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Job-level env so the Socket step's `if:` can test for the secret's presence.
    env:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Socket Security scan
        if: ${{ env.SOCKET_SECURITY_API_KEY != '' }}
        run: |
          repo_slug="${GITHUB_REPOSITORY##*/}"
          branch_name="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          npx -y @socketsecurity/cli@latest scan create \
            --org grecolabs \
            --repo "${repo_slug}" \
            --branch "${branch_name}" \
            --report \
            ./

      - name: OSV scan (Cargo.lock)
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock

      - name: cargo-deny (advisories, licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
