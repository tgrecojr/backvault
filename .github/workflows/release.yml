name: Release restore tool

# A tag `v*` builds `backvault-decrypt` for the operator's machines, runs the tool's own
# test suite on every target, signs and attests each binary, and publishes a GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install musl tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test the restore tool on this target
        run: cargo test -p backvault-decrypt --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p backvault-decrypt --target ${{ matrix.target }}

      - name: Stage asset and checksum
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/backvault-decrypt" "dist/backvault-decrypt-${{ matrix.target }}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "backvault-decrypt-${{ matrix.target }}" > "backvault-decrypt-${{ matrix.target }}.sha256"
          else
            shasum -a 256 "backvault-decrypt-${{ matrix.target }}" > "backvault-decrypt-${{ matrix.target }}.sha256"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: backvault-decrypt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Sign, attest, publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign each binary (keyless, Sigstore bundle)
        run: |
          cd dist
          for bin in backvault-decrypt-*; do
            case "$bin" in *.sha256|*.sigstore.json) continue;; esac
            cosign sign-blob --yes --bundle "$bin.sigstore.json" "$bin"
          done
          ls -la

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/backvault-decrypt-aarch64-apple-darwin
            dist/backvault-decrypt-x86_64-apple-darwin
            dist/backvault-decrypt-x86_64-unknown-linux-musl
            dist/backvault-decrypt-aarch64-unknown-linux-musl

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "backvault-decrypt $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            dist/*
